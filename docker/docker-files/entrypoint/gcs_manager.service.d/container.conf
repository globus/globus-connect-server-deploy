# Drop-in override for gcs_manager.service in Docker containers.
#
# The base unit uses Type=notify with socket activation (Requires=gcs_manager.socket).
# systemd creates the socket and passes it to gunicorn via LISTEN_FDS/LISTEN_PID.
# Since systemctl-mock does not implement socket activation, we override ExecStart
# to bind the socket directly and add pre/post steps to set up the socket path and
# fix its ownership for Apache.
#
# The SocketUser in gcs_manager.socket varies by distro family:
#   Debian/Ubuntu : www-data
#   RHEL/Fedora   : apache
#   SUSE          : wwwrun
# ExecStartPost detects which user is present at runtime.

[Service]
ExecStartPre=+/bin/mkdir -p /run/gcs_manager
ExecStartPre=+/bin/chown gcsweb:gcsweb /run/gcs_manager
ExecStartPre=+/bin/ln -sf /run/gcs_manager/sock /run/gcs_manager.sock

ExecStart=
ExecStart=/opt/globus/bin/gunicorn \
    --workers 4 \
    --preload api_app \
    -t 120 \
    --no-control-socket \
    --bind unix:/run/gcs_manager/sock

ExecStartPost=/bin/sh -c '\
    if   id www-data >/dev/null 2>&1; then WEB=www-data; \
    elif id apache   >/dev/null 2>&1; then WEB=apache;   \
    else                                   WEB=wwwrun;   \
    fi; \
    chmod 600 /run/gcs_manager/sock; \
    chown gcsweb:$WEB /run/gcs_manager/sock'
