# Drop-in override for gcs_manager.service in Docker containers.
#
# The base unit uses Type=notify with socket activation (Requires=gcs_manager.socket).
# systemd creates the socket and passes it to gunicorn via LISTEN_FDS/LISTEN_PID.
# Since systemctl-mock does not implement socket activation, we override ExecStart
# to bind the socket directly and add pre/post steps to set up the socket path and
# fix its ownership for Apache.
#
# The SocketUser in gcs_manager.socket varies by distro family:
#   Debian/Ubuntu : www-data
#   RHEL/Fedora   : apache
#   SUSE          : wwwrun
# The real socket unit gives the socket to the web server (SocketUser) with mode
# 600, so only the web server can connect; the service keeps the open socket it
# created.  ExecStartPost does the same, as root (+) because only root can give a
# file to another user.  It finds the web user at runtime.

[Service]
ExecStartPre=+/bin/mkdir -p /run/gcs_manager
ExecStartPre=+/bin/chown gcsweb:gcsweb /run/gcs_manager
ExecStartPre=+/bin/ln -sf /run/gcs_manager/sock /run/gcs_manager.sock

ExecStart=
ExecStart=/opt/globus/bin/gunicorn \
    --workers 4 \
    --preload api_app \
    -t 120 \
    --no-control-socket \
    --bind unix:/run/gcs_manager/sock

# The 'timeout 5 sh -c until' wait below works around a gap in the mock.  The base
# unit is Type=notify: systemd runs ExecStartPost only after gunicorn reports that
# it is ready, by which time the socket exists.  The mock does not implement that
# notification and runs ExecStartPost as soon as gunicorn is launched, so the
# socket may not exist yet and chmod/chown would fail.  The wait stands in for
# the notification; 5 seconds keeps a start that really failed from hanging.
ExecStartPost=+/bin/sh -c '\
    timeout 5 sh -c "until [ -S /run/gcs_manager/sock ]; do sleep 0.1; done" \
        || { echo "gcs_manager: /run/gcs_manager/sock did not appear within 5 seconds" >&2; exit 1; }; \
    if   id www-data >/dev/null 2>&1; then WEB=www-data; \
    elif id apache   >/dev/null 2>&1; then WEB=apache;   \
    else                                   WEB=wwwrun;   \
    fi; \
    chmod 600 /run/gcs_manager/sock; \
    chown $WEB /run/gcs_manager/sock'
