# Drop-in override for globus-oidc.service in Docker containers.
#
# The base unit uses Type=notify with socket activation (Requires=globus-oidc.socket).
# We override ExecStart to bind the socket directly, mirroring the approach used
# for gcs_manager.service.d/container.conf.
#
# globus-oidc only starts when the ConditionPathExists in the base unit is satisfied
# (config_appsync.yaml must be present).  This is handled naturally by the mock's
# check_conditions() — no change needed here.
#
# The SocketUser in globus-oidc.socket varies by distro family:
#   Debian/Ubuntu : www-data
#   RHEL/Fedora   : apache
#   SUSE          : wwwrun
# The real socket unit gives the socket to the web server (SocketUser) with mode
# 600, so only the web server can connect; the service keeps the open socket it
# created.  ExecStartPost does the same, as root (+) because only root can give a
# file to another user.  It finds the web user at runtime.

[Service]
ExecStartPre=+/bin/mkdir -p /run/globus_oidc
ExecStartPre=+/bin/chown globusoidc:globusoidc /run/globus_oidc
ExecStartPre=+/bin/ln -sf /run/globus_oidc/sock /run/globus_oidc.sock

ExecStart=
ExecStart=/opt/globus/bin/gunicorn \
    --workers 4 \
    --preload wsgi \
    --no-control-socket \
    --bind unix:/run/globus_oidc/sock

# The 'timeout 5 sh -c until' wait below works around a gap in the mock.  The base
# unit is Type=notify: systemd runs ExecStartPost only after gunicorn reports that
# it is ready, by which time the socket exists.  The mock does not implement that
# notification and runs ExecStartPost as soon as gunicorn is launched, so the
# socket may not exist yet and chmod/chown would fail.  The wait stands in for
# the notification; 5 seconds keeps a start that really failed from hanging.
ExecStartPost=+/bin/sh -c '\
    timeout 5 sh -c "until [ -S /run/globus_oidc/sock ]; do sleep 0.1; done" \
        || { echo "globus-oidc: /run/globus_oidc/sock did not appear within 5 seconds" >&2; exit 1; }; \
    if   id www-data >/dev/null 2>&1; then WEB=www-data; \
    elif id apache   >/dev/null 2>&1; then WEB=apache;   \
    else                                   WEB=wwwrun;   \
    fi; \
    chmod 600 /run/globus_oidc/sock; \
    chown $WEB /run/globus_oidc/sock'
