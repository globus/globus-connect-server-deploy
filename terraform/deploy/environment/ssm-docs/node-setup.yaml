schemaVersion: "2.2"
description: Execute scripts as part of GCS Automation that live inside the AMI
parameters:
  SSMID:
    description: The specific identifier that is used in the SSM Parameters path for this endpoint (e.g. abc-ep in /automation/gcs/endpoint/abc-ep)
    type: String
    allowedPattern: ([a-zA-Z0-9_.\-]+)
  workingDirectory:
    description: '(Optional) The parent directory of the scripts (default: /opt/automation/gcs/).'
    type: String
    default: /opt/automation/gcs/
    maxChars: 4096
  executionTimeout:
    description: (Optional) The time in seconds for a command to complete before it is considered to have failed. Default is 600 (10 minutes). Maximum is 28800 (8 hours).
    type: String
    default: "600"
    allowedPattern: ([1-9][0-9]{0,3})|(1[0-9]{1,4})|(2[0-7][0-9]{1,3})|(28[0-7][0-9]{1,2})|(28800)
mainSteps:
  - precondition:
      StringEquals:
        - platformType
        - Linux
    action: aws:runShellScript
    name: main
    inputs:
      runCommand:
        - ./node-setup.sh '{{ SSMID }}'
      workingDirectory: '{{ workingDirectory }}'
      timeoutSeconds: '{{ executionTimeout }}'
