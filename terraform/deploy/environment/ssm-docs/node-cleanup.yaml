schemaVersion: "2.2"
description: Execute scripts as part of GCS Automation that live inside the AMI
parameters:
  SSMID:
    description: The specific identifier that is used in the SSM Parameters path for this endpoint (e.g. abc-ep in /automation/gcs/endpoint/abc-ep)
    type: String
    allowedPattern: ([a-zA-Z0-9_.\-]+)
  workingDirectory:
    description: '(Optional) The parent directory of the scripts (default: /opt/automation/gcs/).'
    type: String
    default: /opt/automation/gcs/
    maxChars: 4096
  executionTimeout:
    description: (Optional) The time in seconds for a command to complete before it is considered to have failed. Default is 600 (10 minutes). Maximum is 28800 (8 hours).
    type: String
    default: "600"
    allowedPattern: ([1-9][0-9]{0,3})|(1[0-9]{1,4})|(2[0-7][0-9]{1,3})|(28[0-7][0-9]{1,2})|(28800)
mainSteps:
  - precondition:
      StringEquals:
        - platformType
        - Linux
    action: aws:runShellScript
    name: main
    inputs:
      runCommand: 
      - |
        #!/usr/bin/env bash
        source /opt/automation/gcs/lib.sh
        ssm_id="{{ SSMID }}"
        ssm_path="${SSM_PREFIX}/endpoint/${ssm_id}"
        if output="$(stat -c '%b' /var/lib/globus-connect-server/info.json 2>&1)"
        then
          if (( output == 0 ))
          then
            logger "Node is not currently setup"
            exit 0
          fi
        else
          fail "Was globus-connect-server installed?"
        fi

        logger "Fetch deployment-key and GCS CLI Envs"
        fetch_deployment_key "${ssm_id}"
        set_gcs_cli_envs "${ssm_id}"

        logger "Running Node Cleanup"
        if ! output="$(echo "y" | sudo -E globus-connect-server -F json node cleanup 2>&1)"
        then
          fail "Failed to run node cleanup" "${output}"
        fi

        token="$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")"
        instance_id="$(curl -sH "X-aws-ec2-metadata-token: ${token}" http://169.254.169.254/latest/meta-data/instance-id)"
        if ! output="$(aws ec2 create-tags --resources "${instance_id}" --tags "Key=cleaned,Value=true")"
        then
          logger "WARNING" "Failed to set tag cleaned to true" 
          logger "ERROR" "${output}"
        fi
      workingDirectory: '{{ workingDirectory }}'
      timeoutSeconds: '{{ executionTimeout }}'
